# KAN-27 / KAN-28: HSTS y cabeceras de seguridad (RNF-SEG-03, RNF-SEG-06)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api.maptiler.com https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss://$host https://api.maptiler.com https://tile.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
